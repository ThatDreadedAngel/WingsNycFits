<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WINGS | Order</title>
  <meta name="description" content="WINGS Streetwear order form. Clothes to Make Your Look Fly.">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .hero {
      min-height: 250px;
      padding: 48px 20px 38px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.12), transparent 35%),
        linear-gradient(135deg, #111 0%, #020202 55%, #111 100%);
      border-bottom: 1px solid #333;
      position: relative;
      overflow: hidden;
    }
    .hero:before, .hero:after {
      content: "✦";
      position: absolute;
      font-size: 70px;
      opacity: .18;
      top: 50%;
      transform: translateY(-50%);
    }
    .hero:before { left: 7%; }
    .hero:after { right: 7%; }
    .brand {
      font-size: clamp(54px, 11vw, 110px);
      line-height: .85;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -7px;
      text-shadow: 0 0 18px rgba(255,255,255,.25);
    }
    .tagline {
      margin-top: 18px;
      font-size: clamp(16px, 2.5vw, 25px);
      font-style: italic;
      letter-spacing: 1px;
    }
    .est {
      margin-top: 16px;
      font-size: 11px;
      letter-spacing: 5px;
      opacity: .65;
    }
    .wrap {
      width: min(1100px, 94%);
      margin: 0 auto;
    }
    .prices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 28px auto 18px;
    }
    .price-card {
      border: 1px solid #444;
      padding: 24px;
      text-align: center;
      background: linear-gradient(145deg, #151515, #080808);
    }
    .price-card span {
      display: block;
      font-size: 13px;
      letter-spacing: 4px;
      opacity: .7;
      margin-bottom: 8px;
    }
    .price-card strong {
      font-size: clamp(42px, 7vw, 65px);
      letter-spacing: -2px;
    }
    .sizes {
      text-align: center;
      padding: 22px;
      border: 1px solid #333;
      background: #0c0c0c;
      margin-bottom: 26px;
    }
    .sizes b { letter-spacing: 3px; }
    .size-list {
      margin: 13px 0 0;
      font-size: 24px;
      letter-spacing: 10px;
    }
    .coming {
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: 2px;
      opacity: .65;
    }
    .form-box {
      background: #fff;
      color: #111;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 auto 40px;
      box-shadow: 0 15px 60px rgba(0,0,0,.5);
    }
    .form-box iframe {
      display: block;
      width: 100%;
      min-height: 1700px;
      border: 0;
    }
    .fallback {
      text-align: center;
      padding: 18px;
      background: #0c0c0c;
      border-top: 1px solid #333;
    }
    .fallback a {
      color: #fff;
      font-weight: 700;
    }
    footer {
      border-top: 1px solid #222;
      padding: 25px 15px 35px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 4px;
      opacity: .6;
    }
    @media (max-width: 650px) {
      .prices { grid-template-columns: 1fr; }
      .brand { letter-spacing: -4px; }
      .form-box iframe { min-height: 1900px; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="brand">WINGS</div>
    <div class="tagline">Clothes to Make Your Look Fly.</div>
    <div class="est">WINGS STREETWEAR • EST. 2025</div>
  </header>

  <main class="wrap">
    <section class="prices" aria-label="WINGS pricing">
      <div class="price-card">
        <span>SHIRTS</span>
        <strong>$25</strong>
      </div>
      <div class="price-card">
        <span>HOODIES</span>
        <strong>$45</strong>
      </div>
    </section>

    <section class="sizes">
      <b>AVAILABLE SIZES</b>
      <div class="size-list">S • M • L</div>
      <div class="coming">XS + XL COMING LATER THIS YEAR</div>
      <div class="coming">PRICE STAYS THE SAME FOR EVERY AVAILABLE SIZE.</div>
    </section>

    <section class="form-box">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSc6hdCwTD5fj2_rpbNomfG5aEEVURZsa1JZgh-4qQ6gx5-NpQ/viewform?embedded=true"
        title="WINGS order form"
        loading="lazy">
        Loading…
      </iframe>
      <div class="fallback">
        Form not loading? <a href="https://docs.google.com/forms/d/e/1FAIpQLSc6hdCwTD5fj2_rpbNomfG5aEEVURZsa1JZgh-4qQ6gx5-NpQ/viewform" target="_blank" rel="noopener">Open the WINGS order form</a>
      </div>
    </section>
  </main>

  <footer>WINGS • CLOTHES TO MAKE YOUR LOOK FLY.</footer>
</body>
</html>
